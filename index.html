<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06060e;--surf:#0d0d18;--card:#12121e;--card2:#181826;--card3:#1e1e2e;--b0:rgba(255,255,255,0.05);--b1:rgba(255,255,255,0.09);--ac:#00e5c0;--ac2:#7b5ea7;--txt:#eeeef5;--mu:#7878a0;--fa:#2e2e45;--dn:#ff5252;--ok:#00e5c0;--wn:#f5a623;--dnb:rgba(255,82,82,0.1);--okb:rgba(0,229,192,0.1);--wnb:rgba(245,166,35,0.1);--dnbr:rgba(255,82,82,0.3);--okbr:rgba(0,229,192,0.3);--wnbr:rgba(245,166,35,0.3);--ag:rgba(0,229,192,0.08)}
html,body{min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.app{min-height:100vh;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;background:var(--surf);border-bottom:1px solid var(--b0);position:sticky;top:0;z-index:10;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;flex-shrink:0}
.lbox{width:32px;height:32px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lbox svg{width:18px;height:18px;fill:var(--bg)}
.lname{font-size:14px;font-weight:600;letter-spacing:.3px}
.lsub{font-size:9px;color:var(--mu);letter-spacing:1.5px;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:7px;border:1px solid var(--b1);background:var(--card2);color:var(--txt);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.bac{background:var(--ac)!important;color:var(--bg)!important;border-color:var(--ac)!important;font-weight:600}
.bac:hover{opacity:.85!important}
.bgh{background:transparent!important;border-color:var(--b1)!important}
.bgh:hover{background:var(--card3)!important;color:var(--txt)!important}
.bdn{border-color:var(--dnbr)!important;color:var(--dn)!important;background:transparent!important}
.bdn:hover{background:var(--dnb)!important}
.bok{border-color:var(--okbr)!important;color:var(--ok)!important;background:transparent!important}
.bok:hover{background:var(--okb)!important}
.bdg{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.bwarn{background:var(--wnb);color:var(--wn);border:1px solid var(--wnbr)}
.bok2{background:var(--okb);color:var(--ok);border:1px solid var(--okbr)}
.binfo{background:rgba(123,94,167,.15);color:#b39ddb;border:1px solid rgba(123,94,167,.3)}
.bdn2{background:var(--dnb);color:var(--dn);border:1px solid var(--dnbr)}
.bown{background:rgba(0,229,192,.15);color:var(--ac);border:1px solid rgba(0,229,192,.3)}
.bhired{background:rgba(255,215,0,.1);color:#ffd700;border:1px solid rgba(255,215,0,.3)}
.page{display:flex;flex-direction:column;align-items:center;padding:40px 20px;gap:16px}
.box{background:var(--card);border:1px solid var(--b0);border-radius:14px;padding:32px;width:100%;max-width:700px}
.box h2{font-size:22px;font-weight:600;margin-bottom:6px}
.sub{font-size:14px;color:var(--mu);margin-bottom:24px;line-height:1.7}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:11px;color:var(--mu);margin-bottom:6px;letter-spacing:.6px;text-transform:uppercase;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;padding:12px 14px;border:1px solid var(--b1);border-radius:8px;background:var(--surf);color:var(--txt);font-family:inherit;font-size:15px;outline:none;transition:border .15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ac)}
.fld textarea{min-height:150px;resize:vertical;line-height:1.7}
.fld select{cursor:pointer}
.pw-w{position:relative}
.pw-w input{padding-right:42px}
.eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mu);cursor:pointer;font-size:14px;padding:2px}
.eye:hover{color:var(--txt)}
.err{background:var(--dnb);color:var(--dn);border:1px solid var(--dnbr);border-radius:8px;padding:10px 13px;font-size:12px;margin-bottom:14px}
.ok-msg{background:var(--okb);color:var(--ok);border:1px solid var(--okbr);border-radius:8px;padding:10px 13px;font-size:12px;margin-bottom:14px}
.maint{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 58px);gap:14px;text-align:center;padding:40px}
.maint h2{font-size:22px;font-weight:600}
.maint p{font-size:14px;color:var(--mu);max-width:360px;line-height:1.8}
.pulse{width:40px;height:2px;background:var(--ac);border-radius:2px;margin:8px auto;animation:pls 2s ease-in-out infinite}
@keyframes pls{0%,100%{opacity:.3;width:20px}50%{opacity:1;width:50px}}
.dash{padding:20px;display:flex;flex-direction:column;gap:16px}
.ttabs{display:flex;border-bottom:1px solid var(--b0);overflow-x:auto}
.ttab{padding:13px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--mu);font-family:inherit;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.ttab:hover{color:var(--txt)}.ttab.on{color:var(--ac);border-bottom-color:var(--ac)}
.tabs{display:flex;border-bottom:1px solid var(--b0);overflow-x:auto;margin-bottom:14px}
.tab{padding:8px 14px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--mu);font-family:inherit;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--txt)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--b0);border-radius:10px;padding:15px}
.sn{font-size:28px;font-weight:600;line-height:1}
.sl{font-size:10px;color:var(--mu);margin-top:5px;text-transform:uppercase;letter-spacing:.6px}
.sw-row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--b0);border-radius:8px;padding:9px 14px}
.sw-row span{font-size:12px;color:var(--mu)}
.sw{position:relative;width:38px;height:21px;cursor:pointer;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw-t{position:absolute;inset:0;border-radius:21px;background:var(--fa);transition:background .2s}
.sw-h{position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--txt);transition:left .2s}
.sw input:checked+.sw-t{background:var(--ac)}.sw input:checked~.sw-h{left:20px}
.clist{display:flex;flex-direction:column;gap:8px}
.ccard{background:var(--card);border:1px solid var(--b0);border-radius:12px;padding:15px;display:flex;align-items:flex-start;gap:13px;transition:border-color .15s}
.ccard:hover{border-color:var(--b1)}
.av{width:42px;height:42px;border-radius:50%;background:rgba(123,94,167,.2);border:1px solid rgba(123,94,167,.25);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#b39ddb;flex-shrink:0}
.ci{flex:1;min-width:0}
.cn{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tnum{font-size:10px;color:var(--ac);background:rgba(0,229,192,.1);border:1px solid rgba(0,229,192,.2);border-radius:5px;padding:2px 7px;font-weight:600;font-family:monospace;letter-spacing:.5px}
.ce{font-size:12px;color:var(--mu);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cm{font-size:12px;color:var(--fa);margin-top:5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.handled{font-size:10px;color:var(--mu);margin-top:5px;font-style:italic}
.ca{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.arow{background:var(--card);border:1px solid var(--b0);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:13px;transition:border-color .15s}
.arow:hover{border-color:var(--b1)}
.ainfo{flex:1;min-width:0}
.aname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.apw{font-size:11px;color:var(--fa);font-family:monospace;margin-top:4px;cursor:pointer;display:flex;align-items:center;gap:5px}
.apw:hover{color:var(--mu)}
.hlog{display:flex;flex-direction:column;gap:7px}
.hrow{background:var(--card);border:1px solid var(--b0);border-radius:10px;padding:12px 15px;display:flex;align-items:flex-start;gap:12px}
.hico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 58px)}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surf);border-bottom:1px solid var(--b0)}
.chat-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--fa) transparent}
.msg{max-width:72%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6}
.msg-me{background:var(--ac);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
.msg-th{background:var(--card2);border:1px solid var(--b1);align-self:flex-start;border-bottom-left-radius:4px}
.mt{font-size:10px;color:var(--fa);margin-top:4px}.mtr{text-align:right}
.chat-bar{display:flex;gap:8px;padding:12px 18px;background:var(--surf);border-top:1px solid var(--b0)}
.cin{flex:1;padding:10px 13px;border:1px solid var(--b1);border-radius:8px;background:var(--card);color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.cin:focus{border-color:var(--ac)}
.modal-bg{position:fixed;inset:0;background:rgba(6,6,14,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border:1px solid var(--b1);border-radius:14px;padding:26px;width:100%;max-width:380px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:18px}
.modal-act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.gl{height:1px;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),transparent);opacity:.5;margin-bottom:18px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--b0)}
.set-row:last-child{border-bottom:none}
.empty{text-align:center;padding:48px;color:var(--fa);font-size:13px}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px}
.spinner{width:36px;height:36px;border:2px solid var(--b1);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.portal-wrap{max-width:720px;margin:0 auto;padding:24px 16px}
.social-btn{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;border:1px solid var(--b1);background:var(--card2);color:var(--txt);text-decoration:none;font-size:12px;font-weight:500;transition:all .15s}
.roblox-btn:hover{border-color:#00b2ff;color:#00b2ff}
.discord-btn:hover{border-color:#5865f2;color:#5865f2}
.lang-sw{display:flex;gap:3px;background:var(--card);border:1px solid var(--b0);border-radius:6px;padding:3px}
.lang-btn{padding:3px 8px;border-radius:4px;border:none;cursor:pointer;font-size:11px;font-weight:500;font-family:inherit;background:transparent;color:var(--mu);transition:all .15s}
.lang-btn.on{background:var(--ac);color:var(--bg)}
.footer{background:var(--surf);border-top:1px solid var(--b0);margin-top:auto}
.footer-nav{display:flex;gap:0;border-bottom:1px solid var(--b0);overflow-x:auto;padding:0 24px}
.footer-tab{padding:14px 20px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--mu);font-family:inherit;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;transition:color .15s}
.footer-tab:hover{color:var(--txt)}.footer-tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.footer-content{padding:32px 28px;max-width:820px;margin:0 auto}
.footer-content h2{font-size:22px;font-weight:600;margin-bottom:8px;color:var(--txt)}
.footer-content h3{font-size:15px;font-weight:600;margin:24px 0 8px;color:var(--ac)}
.footer-content p{font-size:14px;color:var(--mu);line-height:1.9;margin-bottom:14px}
.footer-lead{font-size:15px;color:var(--txt)!important;font-weight:400;line-height:1.9!important;margin-bottom:20px!important;border-left:3px solid var(--ac);padding-left:16px}
.footer-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ag);border:1px solid rgba(0,229,192,.2);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--ac);font-weight:600;margin-bottom:20px;letter-spacing:.5px;text-transform:uppercase}
.footer-step{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start}
.footer-step-num{width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.footer-step-title{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:4px}
.footer-step-desc{font-size:13px;color:var(--mu);line-height:1.7}
.footer-rule{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;background:var(--card);border:1px solid var(--b0);border-radius:10px;margin-bottom:10px}
.footer-rule-ico{font-size:19px;flex-shrink:0;margin-top:1px}
.footer-rule-title{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:3px}
.footer-rule-desc{font-size:12px;color:var(--mu);line-height:1.7}
.footer-bottom{text-align:center;padding:16px 24px;font-size:11px;color:var(--fa);border-top:1px solid var(--b0)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.ccard{flex-wrap:wrap}.ca{width:100%;justify-content:flex-start}.box{padding:20px}.footer-content{padding:20px 16px}}
</style>
</head>

let db;
function L(){return T[S.lang]||T.fr;}

function getMyIds(){try{return JSON.parse(localStorage.getItem('gid_my_ids')||'[]')}catch(e){return[]}}
function saveMyId(id){const ids=getMyIds();if(!ids.includes(id)){ids.push(id);localStorage.setItem('gid_my_ids',JSON.stringify(ids))}}
function setLang(l){S.lang=l;localStorage.setItem('gid_lang',l);render()}

async function validateSession(){
  if(!S.user)return false;
  try{
    if(S.user.role==='owner'){
      const snap=await db.ref('gid/owner').once('value');
      const o=snap.val();
      if(!o||o.username!==S.user.username){localStorage.removeItem('gid_admin');S.user=null;return false;}
      return true;
    }else{
      const snap=await db.ref('gid/admins/'+S.user.id).once('value');
      const a=snap.val();
      if(!a||a.banned||a.username!==S.user.username){localStorage.removeItem('gid_admin');S.user=null;return false;}
      return true;
    }
  }catch(e){return true;}
}

function init(){
  try{const s=localStorage.getItem('gid_admin');if(s)S.user=JSON.parse(s)}catch(e){}
  firebase.initializeApp(FB);
  db=firebase.database();
  db.ref('gid/owner').once('value').then(snap=>{if(!snap.exists()){db.ref('gid/owner').set(DEFAULT_OWNER);db.ref('gid/settings').set({maintenance:false,ticketCounter:0})}});
  db.ref('gid/settings').on('value',d=>{
    const v=d.val()||{};S.maintenance=v.maintenance||false;
    if(S.view==='loading'){
      if(S.user){validateSession().then(ok=>{S.view=ok?'dashboard':(getMyIds().length?'portal':'public');render()});}
      else{S.view=getMyIds().length?'portal':'public';render();}
    }else render();
  });
  db.ref('gid/admins').on('value',d=>{S.admins=d.val()||{};render()});
  db.ref('gid/neededRoles').on('value',d=>{S.neededRoles=d.val()||{};render()});
  db.ref('gid/candidates').on('value',d=>{S.candidates=d.val()||{};render()});
  db.ref('gid/messages').on('value',d=>{S.messages=d.val()||{};render()});
  db.ref('gid/history').on('value',d=>{const v=d.val()||{};S.history=Object.values(v).sort((a,b)=>b.at-a.at).slice(0,80);render()});
}

function ini(n){return(n||'?').trim().split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function ft(ts){return new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function fd(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}
function fds(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cList(){return Object.values(S.candidates)}
function aList(){return Object.values(S.admins)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function addHistory(action,extra){if(S.user)db.ref('gid/history/'+uid()).set({action,at:Date.now(),by:S.user.username||'system',...extra})}
function lClick(){S.lc++;if(S.lt)clearTimeout(S.lt);if(S.lc>=3){S.lc=0;if(!S.user){S.view='login';S.loginErr='';render();}return}S.lt=setTimeout(()=>S.lc=0,900)}

function render(){
  const app=document.getElementById('app');if(!app)return;
  try{
    let html='';
    switch(S.view){
      case 'loading':html='<div class="loading-wrap"><div class="spinner"></div></div>';break;
      case 'login':html=rHdr()+rLogin();break;
      case 'dashboard':html=rHdr()+rDash();break;
      case 'chat':html=rHdr()+rChat();break;
      case 'portal':html=rHdr()+rPortal();break;
      default:html=rHdr()+rPublic()+rFooter();break;
    }
    app.innerHTML=html+(S.modal?rModal():'')+((!S.welcomeSeen&&S.view!=='loading')?rWelcome():'');
    ['cmsg','portal-msgs'].forEach(id=>{const el=document.getElementById(id);if(el)el.scrollTop=el.scrollHeight});
  }catch(e){console.error('Render error:',e);app.innerHTML='<div style="padding:40px;color:#ff5252;font-size:12px">Error: '+e.message+'</div>'}
}

  const l=L(),m=S.modal;let inner='';
  if(m.type==='new-admin'){inner='<h3>'+l.createAdmin+'</h3>'+(m.err?'<div class="err">'+esc(m.err)+'</div>':'')+'<div class="fld"><label>'+l.username+'</label><input id="m-u" value="'+esc(m.u||'')+'" oninput="S.modal.u=this.value" autocomplete="off"/></div><div class="fld"><label>'+l.password+'</label><div class="pw-w"><input id="m-p" type="password" value="'+esc(m.p||'')+'" oninput="S.modal.p=this.value" autocomplete="new-password"/><button class="eye" onclick="tglPw(\'m-p\')">&#128065;</button></div></div><div class="modal-act"><button class="btn bgh" onclick="closeModal()">'+l.cancel+'</button><button class="btn bac" onclick="createAdmin()">'+l.create+' \u2192</button></div>';}
  else if(m.type==='edit-admin'){const a=S.admins[m.id]||{};inner='<h3>'+l.editAdmin+'</h3>'+(m.err?'<div class="err">'+esc(m.err)+'</div>':'')+(m.ok?'<div class="ok-msg">'+esc(m.ok)+'</div>':'')+'<div class="fld"><label>'+l.newUsername+'</label><input id="m-u" value="'+esc(m.u||a.username||'')+'" oninput="S.modal.u=this.value" autocomplete="off"/></div><div class="fld"><label>'+l.newPw+'</label><div class="pw-w"><input id="m-p" type="password" value="'+esc(m.p||'')+'" oninput="S.modal.p=this.value" placeholder="'+l.leaveBlank+'" autocomplete="new-password"/><button class="eye" onclick="tglPw(\'m-p\')">&#128065;</button></div></div><div class="modal-act"><button class="btn bgh" onclick="closeModal()">'+l.cancel+'</button><button class="btn bac" onclick="saveAdmin(\''+m.id+'\')">'+l.save+'</button></div>';}
  else if(m.type==='close-ticket'){const c=S.candidates[m.id]||{};inner='<h3>\uD83D\uDD12 '+l.close+'</h3><p style="font-size:13px;color:var(--mu);margin-bottom:18px;line-height:1.6">'+l.closeDesc+'<br><strong>'+esc(c.prenom||'')+'</strong> (#'+(c.ticketNumber||'')+')</p><div style="display:flex;flex-direction:column;gap:10px"><button class="btn" style="padding:14px;font-size:13px;background:rgba(255,215,0,.08);border-color:rgba(255,215,0,.3);color:#ffd700;text-align:left" onclick="closeTicket(\''+m.id+'\',\'hired\')"><div style="font-size:18px;margin-bottom:4px">\uD83C\uDFC6 '+l.hired+'</div><div style="font-size:11px;color:var(--mu)">'+l.hiringOutcome+'</div></button><button class="btn bdn" style="padding:14px;font-size:13px;text-align:left" onclick="closeTicket(\''+m.id+'\',\'closed\')"><div style="font-size:18px;margin-bottom:4px">\uD83D\uDD12 '+l.closeNoSuite+'</div></button></div><div class="modal-act"><button class="btn bgh" onclick="closeModal()">'+l.cancel+'</button></div>';}
  else if(m.type==='edit-owner-user'){inner='<h3>'+l.changeUsername+'</h3>'+(m.err?'<div class="err">'+esc(m.err)+'</div>':'')+'<div class="fld"><label>'+l.newUsername+'</label><input id="m-u" value="'+esc(m.u||'')+'" oninput="S.modal.u=this.value" autocomplete="off"/></div><div class="fld"><label>'+l.currentPw+'</label><div class="pw-w"><input id="m-cp" type="password" value="'+esc(m.cp||'')+'" oninput="S.modal.cp=this.value" autocomplete="current-password"/><button class="eye" onclick="tglPw(\'m-cp\')">&#128065;</button></div></div><div class="modal-act"><button class="btn bgh" onclick="closeModal()">'+l.cancel+'</button><button class="btn bac" onclick="chOwnerUser()">'+l.save+'</button></div>';}
  else if(m.type==='edit-owner-pw'){inner='<h3>'+l.changePw+'</h3>'+(m.err?'<div class="err">'+esc(m.err)+'</div>':'')+'<div class="fld"><label>'+l.currentPw+'</label><div class="pw-w"><input id="m-cp" type="password" value="'+esc(m.cp||'')+'" oninput="S.modal.cp=this.value" autocomplete="current-password"/><button class="eye" onclick="tglPw(\'m-cp\')">&#128065;</button></div></div><div class="fld"><label>'+l.newPw+'</label><div class="pw-w"><input id="m-np" type="password" value="'+esc(m.np||'')+'" oninput="S.modal.np=this.value" autocomplete="new-password"/><button class="eye" onclick="tglPw(\'m-np\')">&#128065;</button></div></div><div class="modal-act"><button class="btn bgh" onclick="closeModal()">'+l.cancel+'</button><button class="btn bac" onclick="chOwnerPw()">'+l.save+'</button></div>';}
  return '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+inner+'</div></div>';
}

// ACTIONS
function tglPw(id){const i=document.getElementById(id);if(i)i.type=i.type==='password'?'text':'password';}
function openModal(type,id){S.modal={type,id,u:'',p:'',cp:'',np:'',err:'',ok:''};render();}
function closeModal(){S.modal=null;render();}
function goPublic(){S.view='public';S.chatWith=null;render();}
function goDash(){S.view='dashboard';S.chatWith=null;render();}
function logout(){localStorage.removeItem('gid_admin');S.user=null;S.view='public';S.chatWith=null;render();}
function openChat(id){S.chatWith=id;S.view='chat';render();}

async function doLogin(){
  const l=L(),u=S.loginU.trim(),p=S.loginP.trim();
  if(!u||!p){S.loginErr=l.fillFields;render();return;}
  const snap=await db.ref('gid/owner').once('value'),owner=snap.val();
  if(owner&&u===owner.username&&p===owner.password){S.user={role:'owner',username:u};localStorage.setItem('gid_admin',JSON.stringify(S.user));S.view='dashboard';S.loginErr='';render();return;}
  const aSnap=await db.ref('gid/admins').once('value'),admins=aSnap.val()||{};
  const adm=Object.values(admins).find(a=>a.username===u&&a.password===p);
  if(adm){if(adm.banned){S.loginErr=l.bannedMsg;render();return;}S.user={role:'admin',username:u,id:adm.id};localStorage.setItem('gid_admin',JSON.stringify(S.user));S.view='dashboard';S.loginErr='';render();return;}
  S.loginErr=l.wrongCredentials;render();
}

async function doSubmit(){
  const l=L(),{prenom,email,motivation,role,workspace}=S.form;
  if(!prenom.trim()||!email.trim()||!motivation.trim()||!role||!workspace||(role==='developer'&&!S.form.devSpec)){alert(l.fillFields);return;}
  const ticketRef=db.ref('gid/settings/ticketCounter');
  let ticketNum;
  await ticketRef.transaction(cur=>{ticketNum=(cur||0)+1;return ticketNum;});
  const id=uid();
  const devSpec=S.form.devSpec||'';
  const c={id,ticketNumber:ticketNum,prenom:prenom.trim(),email:email.trim(),portfolio:S.form.portfolio.trim(),motivation:motivation.trim(),role,workspace,devSpec,status:'pending',createdAt:Date.now(),handledBy:null,handledAt:null};
  await db.ref('gid/candidates/'+id).set(c);
  await db.ref('gid/history/'+uid()).set({action:'candidate_submitted',name:c.prenom,ticket:ticketNum,by:'candidate',at:Date.now()});
  saveMyId(id);S.portalActive=id;S.submitted=true;S.submittedCandidate=c;render();
}

async function setStatus(id,st){
  const c=S.candidates[id];if(!c)return;
  const actions={selected:'candidate_selected',rejected:'candidate_rejected',pending:'candidate_pending'};
  await db.ref('gid/candidates/'+id).update({status:st,handledBy:S.user.username,handledAt:Date.now()});
  addHistory(actions[st],{name:c.prenom,ticket:c.ticketNumber});
}

async function closeTicket(id,outcome){
  const c=S.candidates[id];if(!c)return;
  await db.ref('gid/candidates/'+id).update({status:outcome,handledBy:S.user.username,handledAt:Date.now()});
  addHistory('ticket_closed',{name:c.prenom,ticket:c.ticketNumber,outcome});
  closeModal();
}

async function toggleMaint(val){
  await db.ref('gid/settings/maintenance').set(val);
  addHistory(val?'maintenance_on':'maintenance_off',{});
}

async function sendAdminMsg(){
  const t=S.chatInput.trim();if(!t)return;
  const c=S.candidates[S.chatWith];if(!c)return;
  await db.ref('gid/messages/'+S.chatWith+'/'+uid()).set({from:'admin',text:t,ts:Date.now(),sender:S.user.username});
  addHistory('message_sent',{name:c.prenom,ticket:c.ticketNumber});
  S.chatInput='';render();
}

async function sendCandidateMsg(candidateId){
  const t=S.chatInput.trim();if(!t)return;
  await db.ref('gid/messages/'+candidateId+'/'+uid()).set({from:'candidate',text:t,ts:Date.now(),sender:'Candidat'});
  S.chatInput='';render();
}

async function createAdmin(){
  const l=L(),u=S.modal.u&&S.modal.u.trim(),p=S.modal.p&&S.modal.p.trim();
  if(!u||!p){S.modal.err=l.fillFields;render();return;}
  if(p.length<4){S.modal.err=l.pwTooShort;render();return;}
  const snap=await db.ref('gid/admins').once('value');
  if(Object.values(snap.val()||{}).find(a=>a.username===u)){S.modal.err=l.nameTaken;render();return;}
  const id=uid();
  await db.ref('gid/admins/'+id).set({id,username:u,password:p,banned:false,createdAt:Date.now()});
  addHistory('admin_created',{target:u});closeModal();
}

async function saveAdmin(id){
  const l=L(),a=S.admins[id];if(!a)return;
  const u=S.modal.u&&S.modal.u.trim(),p=S.modal.p&&S.modal.p.trim();
  if(u&&u!==a.username){const snap=await db.ref('gid/admins').once('value');if(Object.values(snap.val()||{}).find(x=>x.username===u&&x.id!==id)){S.modal.err=l.nameTaken;render();return;}}
  const upd={};if(u)upd.username=u;if(p)upd.password=p;
  await db.ref('gid/admins/'+id).update(upd);
  S.modal.ok=l.modifications;S.modal.err='';render();
}

async function toggleBan(id,ban){
  const a=S.admins[id];if(!a)return;
  await db.ref('gid/admins/'+id+'/banned').set(ban);
  addHistory(ban?'admin_banned':'admin_unbanned',{target:a.username});
}

async function delAdmin(id){
  const a=S.admins[id];if(!a)return;
  if(!confirm('Delete "'+a.username+'"?'))return;
  await db.ref('gid/admins/'+id).remove();
  addHistory('admin_deleted',{target:a.username});
}

async function chOwnerUser(){
  const l=L(),u=S.modal.u&&S.modal.u.trim(),cp=S.modal.cp&&S.modal.cp.trim();
  const snap=await db.ref('gid/owner').once('value'),owner=snap.val();
  if(!owner||cp!==owner.password){S.modal.err=l.incorrectPw;render();return;}
  if(!u){S.modal.err=l.fillNewId;render();return;}
  await db.ref('gid/owner/username').set(u);
  addHistory('owner_changed',{});
  S.user={...S.user,username:u};localStorage.setItem('gid_admin',JSON.stringify(S.user));
  S.flash=l.modifications;closeModal();
  setTimeout(()=>{S.flash='';render();},3000);
}

async function toggleNeeded(key, val){
  await db.ref('gid/neededRoles/'+key).set(val);
  S.neededRoles[key]=val;
}

async function chOwnerPw(){
  const l=L(),cp=S.modal.cp&&S.modal.cp.trim(),np=S.modal.np&&S.modal.np.trim();
  const snap=await db.ref('gid/owner').once('value'),owner=snap.val();
  if(!owner||cp!==owner.password){S.modal.err=l.incorrectPw;render();return;}
  if(!np||np.length<4){S.modal.err=l.pwTooShort;render();return;}
  await db.ref('gid/owner/password').set(np);
  addHistory('owner_changed',{});
  S.flash=l.modifications;closeModal();
  setTimeout(()=>{S.flash='';render();},3000);
}

init();

</script>
</body>
</html>
